set timeout=10
set default=0

menuentry "MaruxOS 2.0.0 \"Cooked\" - Desktop" {
    linux /boot/vmlinuz boot=live quiet
    initrd /boot/initrd.img
}

menuentry "MaruxOS 2.0.0 \"Cooked\" - Safe Mode (CLI, no KMS, no mitigations)" {
    linux /boot/vmlinuz boot=live systemd.unit=multi-user.target nomodeset mitigations=off
    initrd /boot/initrd.img
}

menuentry "MaruxOS 2.0.0 \"Cooked\" - Debug" {
    linux /boot/vmlinuz boot=live debug
    initrd /boot/initrd.img
}
